name: Deploy

# Куда деплоить, задаёт переменная репозитория DEPLOY_TARGET (Settings → Secrets and variables → Actions → Variables):
#   не задана или server — Node-приложение на свой сервер по SSH, работает личный кабинет;
#   ftp                  — запасной вариант: статика по FTP на хостинг, новый кабинет выключен
#                          (ссылки ведут в старую CMS).
# Подробности — docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускать два деплоя одновременно; новый ждёт окончания текущего.
# Не отменяем: прерванная заливка оставит на сервере смесь старых и новых файлов.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ftp:
    name: Static site → FTP
    if: vars.DEPLOY_TARGET == 'ftp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        run: npm run generate
        env:
          # В статике нет бэкенда: ссылки на кабинет ведут в старую CMS (см. links.legacyCabinet)
          NUXT_PUBLIC_CABINET_ENABLED: 'false'

      - name: Check build output
        run: test -f .output/public/index.html

      - name: Upload to hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          # ftp | ftps — задаётся секретом FTP_PROTOCOL; ftps шифрует пароль и файлы, если хостинг его поддерживает
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./.output/public/
          server-dir: ${{ secrets.FTP_DIR || '/www/l2azimut.ru/' }}
          dangerous-clean-slate: false
          log-level: standard

  server:
    name: Node app → server
    if: vars.DEPLOY_TARGET != 'ftp'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Должны совпадать с scripts/server/setup.sh
      APP_DIR: /var/www/azimut
      SERVICE: azimut
      PORT: 3000
      KEEP_RELEASES: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack build
        run: tar -czf release.tar.gz -C .output .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT || '22' }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload release
        run: |
          RELEASE="$APP_DIR/releases/${GITHUB_SHA::7}-$(date +%Y%m%d%H%M%S)"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          ssh server "mkdir -p '$RELEASE'"
          scp release.tar.gz "server:$RELEASE/release.tar.gz"
          ssh server "cd '$RELEASE' && tar -xzf release.tar.gz && rm release.tar.gz"

      # Переключение на новый релиз; если сайт не поднялся — автоматический откат на предыдущий
      - name: Switch, restart and check
        run: |
          ssh server "APP_DIR='$APP_DIR' SERVICE='$SERVICE' PORT='$PORT' KEEP='$KEEP_RELEASES' RELEASE='$RELEASE' bash -s" <<'EOF'
          set -euo pipefail
          prev="$(readlink "$APP_DIR/current" || true)"
          ln -sfn "$RELEASE" "$APP_DIR/current"
          sudo /usr/bin/systemctl restart "$SERVICE"

          up() {
            for i in $(seq 1 15); do
              curl -fsS -o /dev/null "http://127.0.0.1:$PORT/" && return 0
              sleep 2
            done
            return 1
          }

          if ! up; then
            echo "::error::Сайт не ответил после рестарта"
            journalctl -u "$SERVICE" -n 50 --no-pager || true
            if [ -n "$prev" ] && [ -d "$prev" ]; then
              ln -sfn "$prev" "$APP_DIR/current"
              sudo /usr/bin/systemctl restart "$SERVICE"
              echo "::warning::Откатились на предыдущий релиз: $(basename "$prev")"
            fi
            rm -rf "$RELEASE"
            exit 1
          fi
          echo "Сайт отвечает: $(basename "$RELEASE")"

          # Оставляем последние релизы (текущий не удаляем никогда)
          cd "$APP_DIR/releases"
          ls -1t | { grep -vxF "$(basename "$RELEASE")" || true; } | tail -n +"$KEEP" | xargs -r rm -rf
          EOF

      # Сайт работает, но кабинету нужны .env и доступ к БД: проверяем отдельно, без отката
      - name: Check cabinet
        run: |
          ssh server "PORT='$PORT' SERVICE='$SERVICE' APP_DIR='$APP_DIR' bash -s" <<'EOF'
          res="$(curl -sS "http://127.0.0.1:$PORT/api/health" || true)"
          echo "health: $res"
          case "$res" in
            *'"ok":true'*) exit 0 ;;
          esac
          echo "::error::Личный кабинет не готов (session — ключ сессии, db — доступ к базе). Проверьте $APP_DIR/.env и права MySQL, затем: sudo systemctl restart $SERVICE"
          journalctl -u "$SERVICE" -n 30 --no-pager | grep -E 'cabinet|health' || true
          exit 1
          EOF
